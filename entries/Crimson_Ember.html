    raf = requestAnimationFrame(draw);
    if (now - last < 1000 / 30) return;
    time += Math.min((now - last) / 1000, 0.06);
    last = now;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(base, 0, 0);
    // Continuous refraction bends the actual flame artwork, not the ornaments.
    const start = Math.floor(height * 0.27);
    const step = Math.max(3, Math.round(height / 210));
    for (let y = start; y < height; y += step) {
      const depth = (y - start) / (height - start);
      const envelope = Math.sin(Math.min(1, depth * 3) * Math.PI / 2);
      const dx = (Math.sin(y * 0.026 - time * 1.15) + Math.sin(y * 0.011 + time * 0.72) * 0.55) * envelope * Math.min(width * 0.0035, 4.5);
      const sourceY = Math.max(0, Math.min(height - step - 1, y + Math.sin(y * 0.018 - time * 0.9) * envelope * 2));
      const stripHeight = Math.min(step + 1, height - sourceY, height - y);
      ctx.drawImage(base, 0, sourceY, width, stripHeight, dx - 3, y, width + 6, stripHeight);
    }
    // Sparse embers stay along the sides or near the bottom, away from the chat.
    ctx.globalCompositeOperation = 'screen';
    const count = innerWidth < 600 ? 24 : sparks.length;
    for (let i = 0; i < count; i++) {
      const spark = sparks[i];
      const progress = (time * spark.speed + spark.phase) % 1;
      const life = Math.sin(progress * Math.PI);
      const side = spark.side;
      let x = side === 0 ? width * (0.018 + spark.x * 0.13) : side === 1 ? width * (0.852 + spark.x * 0.13) : width * spark.x;
      const travel = side === 2 ? height * 0.17 : height * 0.65;
      const y = height * 1.02 - progress * travel;
      x += Math.sin(progress * 5 + i) * Math.min(width * 0.009, 10);
      const radius = spark.size * Math.min(width / 1200, 1.2);
      ctx.globalAlpha = life * 0.48;
      const halo = ctx.createRadialGradient(x, y, 0, x, y, radius * 5);
      halo.addColorStop(0, '#ff9b42'); halo.addColorStop(0.2, '#fc451c'); halo.addColorStop(1, 'rgba(184,12,0,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(x - radius * 5, y - radius * 5, radius * 10, radius * 10);
      ctx.fillStyle = '#ffd08b';
      ctx.beginPath(); ctx.ellipse(x, y, radius * 0.5, radius, -0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  function sync() {
    cancelAnimationFrame(raf); raf = 0;
    if (!loaded) return;
    canvas.classList.add('ready');
    if (reduced.matches || document.hidden) { ctx.drawImage(base, 0, 0); return; }
    last = performance.now();
    canvas.classList.add('ready');
    raf = requestAnimationFrame(draw);
  }
  function init() { if (loaded) return; loaded = true; resize(); sync(); }
  art.addEventListener('load', init, {once: true});
  if (art.complete && art.naturalWidth) init();
  addEventListener('resize', resize, {passive: true});
  document.addEventListener('visibilitychange', sync);
  reduced.addEventListener('change', sync);
})();
</script>
</body>
